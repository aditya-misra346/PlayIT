name: Cross-Platform Sync, Verification & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-web-and-server:
    name: Web, PWA & Recognition Engine Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cross-platform version synchronization
        run: node scripts/sync-platforms.mjs --check
      - name: Install & test recognition server
        run: |
          cd server
          npm install
          npm test
          npm run build
      - name: Install & build Web + PWA
        run: |
          cd web
          npm install
          npm run build

  verify-ios-core:
    name: iOS & iPadOS AuralisCore Swift Package Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run swift test in ios/AuralisCore
        run: |
          cd ios/AuralisCore
          swift test

  verify-android:
    name: Android Kotlin/Compose Unit Tests & APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run Android unit tests & assemble debug APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug

  verify-desktop-rust:
    name: Desktop Rust Audio & DSP Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS ScreenCaptureKit helper & run Rust unit tests
        run: |
          ./desktop/scripts/build-macos-helper.sh
          cd desktop/src-tauri
          cargo test
