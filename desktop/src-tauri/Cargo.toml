[package]
name = "auralis-desktop"
version = "1.2.0"
description = "Auralis native desktop music recognition client (Tauri 2)"
authors = ["Auralis Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "auralis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
base64 = "0.22"
