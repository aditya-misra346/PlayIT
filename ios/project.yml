name: Auralis
options:
  bundleIdPrefix: com.auralis
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  AuralisCore:
    path: AuralisCore

targets:
  Auralis:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - Auralis.entitlements
    resources:
      - path: App/PrivacyInfo.xcprivacy
    info:
      path: App/Info.plist
    entitlements:
      path: App/Auralis.entitlements
      properties:
        com.apple.developer.shazamkit: true
    settings:
      base:
        PRODUCT_NAME: Auralis
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.ios
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Auralis.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: true
    dependencies:
      - package: AuralisCore
        product: AuralisCore
      - sdk: ShazamKit.framework
      - sdk: AVFoundation.framework
